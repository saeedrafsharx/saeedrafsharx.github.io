name: Update YouTube videos

on:
  schedule:
    # Every 6 hours, so new uploads show up on the site without any manual step.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-youtube
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest videos
        run: python3 scripts/fetch_youtube.py

      - name: Commit if the feed changed
        run: |
          if git diff --quiet -- youtube.json; then
            echo "No new videos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube.json
          git commit -m "Update latest YouTube videos"
          git push
